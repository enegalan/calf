name: ui
description: "calf UI App."
publish_to: 'none'
version: 1.0.11+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  lucide_icons_flutter: ^3.1.15
  web_socket_channel: ^3.0.3
  xterm: ^4.0.0
  fl_chart: ^0.70.2
  path: ^1.9.1
  path_provider: ^2.1.5
  file_selector: ^1.0.3
  tray_manager: ^0.5.3
  window_manager: ^0.5.0
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/tray/
    - assets/icons/build/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
